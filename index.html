<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Essentials — programas e ferramentas reunidos em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bufus Essentials">
  <meta property="og:description" content="Catálogo de programas e ferramentas tiradas do servidor do Bufus, alguns deles podem te servir de atalho pra muita coisa, ainda mais quando está com um PC novo em folha.">
  <meta property="og:url" content="https://komashifx.github.io/essentials/">
  <title>Essentials</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=2026.10.20-search-toolbar">
</head>
<body>
  <header class="site-header">
    <a class="brand-lockup" href="#/" aria-label="Bufus Essentials">
      <span class="brand-title">Bufus <em>Essentials</em></span>
      <span class="brand-kicker"><iconify-icon icon="solar:heart-linear" aria-hidden="true"></iconify-icon>Hospedado com amor pelo GitHub</span>
    </a>
    <div class="header-actions">
      <div class="theme-control">
        <button id="theme-toggle" class="theme-toggle glass-control cursor-glow" type="button" aria-label="Mudar para tema claro">
          <iconify-icon id="theme-icon" icon="solar:moon-stars-linear" aria-hidden="true"></iconify-icon>
        </button>
        <p id="light-theme-warning" class="theme-warning" role="status" hidden>
          <span class="theme-warning-icons" aria-hidden="true">
            <iconify-icon class="warning-symbol" icon="material-symbols:warning-rounded"></iconify-icon>
            <iconify-icon class="eye-symbol" icon="mdi:eye-outline"></iconify-icon>
          </span>
          <span>O tema claro pode cansar a visão, e logos SVG brancas podem ficar invisíveis.</span>
        </p>
      </div>
      <details class="toolbar-settings">
        <summary class="settings-toggle glass-control cursor-glow" aria-label="Configurações adicionais" title="Configurações adicionais">
          <iconify-icon icon="mdi:palette-swatch-variant" aria-hidden="true"></iconify-icon>
        </summary>
        <div class="settings-panel">
          <p class="settings-heading">Configurações</p>
          <label class="appearance-toggle" for="animations-choice">
            <iconify-icon class="setting-icon" icon="solar:magic-stick-3-linear" aria-hidden="true"></iconify-icon>
            <span class="appearance-toggle-copy"><span>Animações</span><small>Movimento da interface</small></span>
            <input id="animations-choice" type="checkbox">
          </label>
          <label class="appearance-toggle" for="glass-choice">
            <iconify-icon class="setting-icon" icon="mdi:memory" aria-hidden="true"></iconify-icon>
            <span class="appearance-toggle-copy"><span>Efeitos de vidro</span><small>Desativar vidro e borrões</small></span>
            <input id="glass-choice" type="checkbox" checked>
          </label>
        </div>
      </details>
    </div>
  </header>
  <section class="catalog-shell" aria-label="Pesquisa e filtros do catálogo">
    <div class="catalog-toolbar">
      <div class="search-field cursor-glow">
        <iconify-icon class="icon" icon="solar:magnifer-linear" aria-hidden="true"></iconify-icon>
        <input id="search" autocomplete="off" spellcheck="false" placeholder="Pesquisar no catálogo" aria-label="Pesquisar">
        <kbd class="search-shortcut" aria-hidden="true">Ctrl K</kbd>
        <button id="search-clear" class="search-clear" type="button" aria-label="Limpar pesquisa" title="Limpar pesquisa" hidden>×</button>
      </div>
      <button id="filters-toggle" class="catalog-control filters-toggle" type="button" aria-expanded="false" aria-controls="catalog-filter-panel">
        <iconify-icon class="icon" icon="solar:filter-linear" aria-hidden="true"></iconify-icon>
        <span>Filtros</span>
      </button>
      <div class="view-toggle" role="group" aria-label="Modo de visualização">
        <button class="catalog-control view-choice active" type="button" data-view="grid" aria-label="Visualização em grade" title="Visualização em grade" aria-pressed="true">
          <iconify-icon class="icon" icon="solar:widget-5-linear" aria-hidden="true"></iconify-icon>
        </button>
        <button class="catalog-control view-choice" type="button" data-view="list" aria-label="Visualização em lista" title="Visualização em lista" aria-pressed="false">
          <iconify-icon class="icon" icon="solar:list-linear" aria-hidden="true"></iconify-icon>
        </button>
      </div>
    </div>
    <section id="catalog-filter-panel" class="filter-panel" aria-label="Filtros do catálogo" aria-hidden="true" inert>
      <div id="catalog-filter-content" class="filter-panel-content"></div>
    </section>
    <main id="app" aria-live="polite"></main>
  </section>

  <footer class="footer">
    <span class="footer-note">Feito para ajudar a todos a encontrar o melhor da internet</span>
    <span class="copyright">© 2026 KomashiOFC</span>
  </footer>

  <script defer src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>
  <script defer src="data/items/index.js?v=f6e556ce6c31"></script>
  <script defer src="app.js?v=2026.10.20-search-toolbar"></script>
</body>
</html>
