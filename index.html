<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo do Essentials.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bufus Essentials">
  <meta property="og:description" content="Catálogo de programas e ferramentas tiradas do servidor do Bufus, alguns deles podem te servir de atalho pra muita coisa, ainda mais quando está com um PC novo em folha.">
  <meta property="og:url" content="https://komashifx.github.io/essentials/">
  <meta property="og:image" content="https://komashifx.github.io/essentials/assets/banner.png">
  <title>Essentials</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main id="app" aria-live="polite"></main>
  <section class="music-player is-mini" id="music-player" aria-label="Player de música">
    <div class="player-track" id="player-track">
      <a class="player-art" id="player-art" aria-label="Capa da música atual" rel="noopener" target="_blank"><img class="player-art-current" alt="" loading="eager"><img class="player-art-next" alt="" loading="eager"><span class="player-art-icon"><iconify-icon icon="solar:music-note-3-linear"></iconify-icon></span></a>
      <div class="player-copy">
        <a id="player-title-link" rel="noopener" target="_blank"><strong id="player-title">Carregando músicas...</strong></a>
        <span id="player-artist">SUI UZI</span>
        <a class="player-source" id="player-source-link" href="https://soundcloud.com/sui_uzi" target="_blank" rel="noopener">
          <iconify-icon icon="simple-icons:soundcloud" aria-hidden="true"></iconify-icon><span>SoundCloud</span>
        </a>
      </div>
    </div>
    <div class="player-controls" aria-label="Controles de reprodução">
      <button class="player-icon" id="player-prev" type="button" aria-label="Música anterior" title="Música anterior"><iconify-icon icon="solar:skip-previous-linear"></iconify-icon></button>
      <button class="player-play" id="player-play" type="button" aria-label="Reproduzir" title="Reproduzir"><iconify-icon icon="solar:play-linear"></iconify-icon></button>
      <button class="player-icon" id="player-next" type="button" aria-label="Próxima música" title="Próxima música"><iconify-icon icon="solar:skip-next-linear"></iconify-icon></button>
    </div>
    <div class="player-progress">
      <span id="player-current">0:00</span>
      <input id="player-seek" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
      <span id="player-duration">0:00</span>
    </div>
    <div class="player-volume">
      <iconify-icon icon="solar:volume-loud-linear" aria-hidden="true"></iconify-icon>
      <input id="player-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
    <iframe id="soundcloud-player" title="Player do SoundCloud" allow="autoplay; encrypted-media" loading="lazy"></iframe>
  </section>
  <footer class="footer">
    <span class="footer-note">Feito para ajudar a todos a encontrar o melhor da internet</span>
    <span class="copyright">© 2026 KomashiOFC</span>
  </footer>
  <script src="data/items/index.js?v=656baf1687d5"></script>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="app.js?v=player-redesign-4"></script>
</body>
</html>
