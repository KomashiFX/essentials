<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo do Essentials.">
  <title>Essentials</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main id="app" aria-live="polite"></main>

  <div class="player-now-playing" id="player-now-playing" aria-live="polite" aria-hidden="true">
    <div class="now-playing-art" id="player-now-playing-art" aria-hidden="true"><iconify-icon icon="solar:music-note-3-linear"></iconify-icon></div>
    <div class="now-playing-copy">
      <span>TOCANDO AGORA</span>
      <strong id="player-now-playing-title"></strong>
      <small id="player-now-playing-artist"></small>
    </div>
  </div>
  <section class="music-player" id="music-player" aria-label="Player de música">
    <div class="player-track" id="player-track">
      <a class="player-art" id="player-art" aria-label="Capa da música atual" rel="noopener" target="_blank"><iconify-icon icon="solar:music-note-3-linear"></iconify-icon></a>
      <div class="player-copy">
        <a id="player-title-link" rel="noopener" target="_blank"><strong id="player-title">Nenhuma música selecionada</strong></a>
        <span id="player-artist">Nenhuma faixa disponível</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-icon" id="player-prev" type="button" aria-label="Música anterior" title="Música anterior"><iconify-icon icon="solar:skip-previous-linear"></iconify-icon></button>
      <button class="player-play" id="player-play" type="button" aria-label="Reproduzir" title="Reproduzir"><iconify-icon icon="solar:play-linear"></iconify-icon></button>
      <button class="player-icon" id="player-next" type="button" aria-label="Próxima música" title="Próxima música"><iconify-icon icon="solar:skip-next-linear"></iconify-icon></button>
    </div>
    <div class="player-progress">
      <span id="player-current">0:00</span>
      <input id="player-seek" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
      <span id="player-duration">0:00</span>
    </div>
    <div class="player-volume">
      <iconify-icon icon="solar:volume-loud-linear" aria-hidden="true"></iconify-icon>
      <input id="player-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <footer class="footer">
    <span class="footer-note">Feito para ajudar a todos a encontrar o melhor da internet</span>
    <span class="copyright">© 2026 KomashiOFC</span>
  </footer>

  <script src="data/items/index.js?v=4cf74633bcf0"></script>
  <script src="app.js?v=svg-fix-1"></script>
</body>
</html>
