name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar índice dos itens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          items = Path('data/items')
          output = items / 'index.js'
          catalog = []
          for path in sorted(items.glob('*.json'), key=lambda item: item.name.lower()):
            raw = path.read_text(encoding='utf-8').strip()
            if not raw:
              continue
            try:
              item = json.loads(raw)
            except json.JSONDecodeError as error:
              print(f'Ignorado {path.name}: {error}')
              continue
            item.setdefault('slug', path.stem.lower().replace(' ', '-'))
            catalog.append({
              'file': path.name,
              **{key: item.get(key) for key in (
                'slug', 'Title', 'aliases', 'Description', 'Category',
                'Image', 'Logo', 'Banner'
              )}
            })
          output.write_text(
            'window.ESSENTIALS_ITEMS = ' + json.dumps(catalog, ensure_ascii=False, indent=2) + ';\n',
            encoding='utf-8'
          )
          print(f'Índice gerado com {len(catalog)} itens')
          PY

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Criar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
